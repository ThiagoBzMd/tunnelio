name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Runs by hand (Actions → CI → Run workflow), and on pushes and pull requests only where the
# repository variable RUN_CI is "true": the maintainer runs the same parts locally before every
# release and deploy (scripts/check.sh), so GitHub does not test them again. Jobs with `needs` are
# skipped along with the gated ones. Windows and macOS tray tests: ci-tray-platforms.yml, by hand.

jobs:
  vectors:
    name: Protocol vectors are reproducible
    if: github.event_name == 'workflow_dispatch' || vars.RUN_CI == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install cryptography argon2-cffi
      - name: Regenerate and diff (any change = protocol change)
        working-directory: docs/vectors
        run: |
          python gen_vectors.py
          git diff --exit-code -- vectors.json

  tray:
    name: Tray (Go)
    if: github.event_name == 'workflow_dispatch' || vars.RUN_CI == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: tray } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"          # the newest patch release (go.mod's `go` line is the minimum)
          check-latest: true
          cache-dependency-path: tray/go.sum
      - name: Build
        run: go build ./...
      - name: Test (includes vectors + import-rule tests)
        run: go test ./...
      - name: Lint (security rules via depguard)
        uses: golangci/golangci-lint-action@v8
        with:
          working-directory: tray
          version: v2.14.0

  server:
    name: Server (Django)
    if: github.event_name == 'workflow_dispatch' || vars.RUN_CI == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    env:
      DJANGO_SETTINGS_MODULE: tunnelio.settings.test
      SECRET_KEY: ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements/dev.txt
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python -m pytest -q

  web:
    name: Web (TypeScript)
    if: github.event_name == 'workflow_dispatch' || vars.RUN_CI == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test -- --run
      - run: npm run build

  interop:
    name: Interop (Django relay + Go tray + TS CLI, real processes)
    runs-on: ubuntu-latest
    needs: [tray, server, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: server/requirements/dev.txt }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-go@v5
        with: { go-version-file: tray/go.mod, cache-dependency-path: tray/go.sum }
      - name: Install
        run: |
          python -m venv server/.venv && server/.venv/bin/pip install -r server/requirements/dev.txt
          (cd web && npm ci)
          (cd tray && go build -o bin/tunnelio ./cmd/tunnelio)
      - name: Run scripts/interop.sh (no Ollama in CI → pairing, presence, reconnect only)
        run: scripts/interop.sh

  image:
    name: Server image builds
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: false
          tags: tunnelio-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
